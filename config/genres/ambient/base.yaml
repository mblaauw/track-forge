name: Ambient
color: violet
song_structure:
  - section: emerge
    fn: establish
    bars:
      base: 12
      per_complexity: 1.5
    tags:
      - atmospheric
      - sparse texture
  - section: swell
    fn: escalate
    bars:
      base: 16
      per_complexity: 2
    tags:
      - rising tension
  - section: drift
    fn: peak
    bars:
      base: 16
      per_complexity: 1.5
    tags:
      - wide theme
      - full arrangement
  - section: fade
    fn: resolve
    bars:
      base: 12
      per_complexity: 1.5
    tags:
      - reduce layers
descriptor_categories:
  - cat: sound
    label: TEXTURE
    hue: var(--hue-cyan)
    chips:
      - granular pad
      - field recording
      - glass harmonica
      - tape loop
      - drone
      - glockenspiel
      - organ
  - cat: rhythm
    label: PULSE
    hue: var(--hue-amber)
    chips:
      - slow pulse
      - no beat
      - irregular rhythm
      - gentle swell
      - lullaby tempo
  - cat: atmosphere
    label: SPACE
    hue: var(--hue-violet)
    chips:
      - ethereal
      - cinematic
      - intimate
      - vast
      - underwater
      - meditative
      - open
  - cat: production
    label: LUSH
    hue: var(--hue-green)
    chips:
      - wide stereo
      - analog warmth
      - reverb wash
      - tape saturation
      - soft compression
  - cat: energy
    label: ENERGY
    hue: var(--hue-red)
    chips:
      - still
      - slow build
      - floating
      - calm
      - hypnotic
      - sparse
      - dense
descriptor_defaults:
  - label: granular pad
    cat: sound
    weight: 2
  - label: slow pulse
    cat: rhythm
    weight: 2
  - label: cinematic
    cat: atmosphere
    weight: 2
  - label: ethereal
    cat: atmosphere
    weight: 2
  - label: wide stereo
    cat: production
    weight: 2
lyric_themes:
  - stillness
  - memory
  - nature
  - solitude
  - dreams
  - distance
section_palette:
  - Emerge
  - Swell
  - Drift
  - Movement
  - Interlude
  - Crescendo
  - Transition
  - Spoken Word
  - Solo
  - Fade
vocal_presets:
  - type: female_lead
    delivery_style: ethereal
    default_energy: 1
  - type: male_lead
    delivery_style: ethereal
    default_energy: 1
  - type: duet
    delivery_style: ethereal
    default_energy: 1
  - type: group_choir
    delivery_style: ethereal
    default_energy: 2
  - type: wordless_textural
    delivery_style: ethereal
    default_energy: 1
