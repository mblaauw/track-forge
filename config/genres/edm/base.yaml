name: EDM
color: cyan
song_structure:
  - section: intro
    fn: establish
    bars:
      base: 8
      per_complexity: 0.5
    tags:
      - atmospheric
      - sparse texture
  - section: build
    fn: introduce
    bars: 8
    tags:
      - add rhythm
      - rising tension
  - section: drop
    fn: peak
    bars:
      base: 16
      per_energy: 1.2
    tags:
      - full groove
      - bass-led
      - wide theme
  - section: breakdown
    fn: remove
    bars:
      base: 8
      per_complexity: 0.8
    tags:
      - strip drums
      - expose harmony
  - section: build_2
    fn: escalate
    bars: 8
    tags:
      - rising tension
  - section: drop_2
    fn: peak
    bars:
      base: 16
      per_energy: 1.2
    tags:
      - added impact
      - add countermelody
  - section: bridge
    fn: contrast
    bars: 8
    tags:
      - introspective
  - section: outro
    fn: resolve
    bars:
      base: 8
      per_complexity: 0.5
    tags:
      - reduce layers
descriptor_categories:
  - cat: sound
    label: SOUND DESIGN
    hue: var(--hue-cyan)
    chips:
      - supersaw
      - reese bass
      - pluck lead
      - fm bells
      - granular pad
      - detuned saw
      - sine sub
      - vocal chops
      - arp sequence
      - saw stabs
  - cat: rhythm
    label: RHYTHM
    hue: var(--hue-amber)
    chips:
      - four-on-the-floor
      - syncopated hats
      - offbeat bass
      - rolling toms
      - breakbeat
      - driving kick
      - shuffled groove
  - cat: atmosphere
    label: ATMOSPHERE
    hue: var(--hue-violet)
    chips:
      - euphoric
      - dark
      - dreamy
      - hypnotic
      - cinematic
      - nostalgic
      - uplifting
      - tense
  - cat: production
    label: PRODUCTION
    hue: var(--hue-green)
    chips:
      - sidechain pump
      - wide stereo
      - analog warmth
      - crisp transients
      - tape saturation
      - polished master
      - heavy compression
  - cat: energy
    label: ENERGY
    hue: var(--hue-red)
    chips:
      - high energy
      - driving
      - restrained build
      - explosive drop
      - relentless
      - dynamic swells
descriptor_defaults:
  - label: supersaw
    cat: sound
    weight: 2
  - label: four-on-the-floor
    cat: rhythm
    weight: 2
  - label: sidechain pump
    cat: production
    weight: 2
  - label: euphoric
    cat: atmosphere
    weight: 2
  - label: high energy
    cat: energy
    weight: 2
lyric_themes:
  - euphoria
  - nightlife
  - letting go
  - transcendence
  - togetherness
  - the drop
section_palette:
  - Intro
  - Build
  - Drop
  - Breakdown
  - Bridge
  - Verse
  - Chorus
  - Hook
  - Pre-Chorus
  - Post-Chorus
  - Final Chorus
  - Final Hook
  - Solo
  - Crescendo
  - Transition
  - Spoken Word
  - Outro
vocal_presets:
  - type: female_lead
    delivery_style: anthemic
    default_energy: 4
  - type: male_lead
    delivery_style: anthemic
    default_energy: 4
  - type: duet
    delivery_style: anthemic
    default_energy: 4
  - type: group_choir
    delivery_style: anthemic
    default_energy: 4
  - type: wordless_textural
    delivery_style: ethereal
    default_energy: 2
